[workspace]
members = [
    "TensorNetworks/Cotengra/",
]
resolver = "2"

[patch.crates-io]
# Pinned to a specific rev so fresh checkouts can't drift into an
# incompatible pair with wolfram-library-link. Bump when the branch
# advances.
wolfram-app-discovery = { git = "https://github.com/sw1sh/wolfram-app-discovery-rs", rev = "fa73a0e316d6d45c470ba0f69af2489c97808be4" }
wolfram-expr = { git = "https://github.com/sw1sh/wolfram-expr-rs", rev = "22bd629c61ceff5089c968218ad319853ca6d526" }

[profile.release]
opt-level = 3